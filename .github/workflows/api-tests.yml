name: Automated API Tests CI-CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'postman/**'
      - 'sut/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'postman/**'
      - 'sut/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:


jobs:
  api-regression-tests:
    name: Run Newman Data-Driven API Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Start EShop SUT Backend Server
        run: |
          node sut/server.js &
          echo "Waiting for SUT server to be ready on http://localhost:3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/products > /dev/null; then
              echo "SUT Backend is ready!"
              break
            fi
            echo "Waiting for SUT ($i/30)..."
            sleep 1
          done

      - name: Execute Pool A (FR-05 Products API Tests)
        id: test_fr05
        run: |
          mkdir -p reports
          npx newman run postman/HW06_PoolA_FR05_DataDriven.postman_collection.json \
            -d postman/data/data_driven_FR05.csv \
            -e postman/EShop_Local.postman_environment.json \
            -r cli,htmlextra \
            --suppress-exit-code \
            --reporter-htmlextra-export reports/newman_report_FR05_DataDriven.html

      - name: Execute Pool B (FR-08 Checkout API Tests)
        id: test_fr08
        run: |
          npx newman run postman/HW06_PoolB_FR08_DataDriven.postman_collection.json \
            -d postman/data/data_driven_FR08.csv \
            -e postman/EShop_Local.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/newman_report_FR08_DataDriven.html

      - name: Execute Pool C (FR-18 Orders API Tests)
        id: test_fr18
        run: |
          npx newman run postman/HW06_PoolC_FR18_DataDriven.postman_collection.json \
            -d postman/data/data_driven_FR18.csv \
            -e postman/EShop_Local.postman_environment.json \
            -r cli,htmlextra \
            --suppress-exit-code \
            --reporter-htmlextra-export reports/newman_report_FR18_DataDriven.html

      - name: Publish Newman HTML Reports as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-api-test-reports
          path: reports/*.html
          retention-days: 14

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## API Test Automation Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | API Endpoint | Iterations | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Pool A (FR-05) | GET /api/products | 40 | ${{ steps.test_fr05.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pool B (FR-08) | POST /api/checkout | 45 | ${{ steps.test_fr08.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pool C (FR-18) | PUT/GET /api/admin/orders | 45 | ${{ steps.test_fr18.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Anti-Cheat Header: X-Student-Id: 23127462" >> $GITHUB_STEP_SUMMARY
